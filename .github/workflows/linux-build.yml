name: Linux Build

# Linux counterpart of windows-build.yml / mac-build.yml: same trigger set,
# same determine-mode gate, GitHub Release per release build.
#
# Differences forced by the platform:
#   - No code signing or notarization: Linux has no signing requirement, so
#     the whole signing-mode machinery collapses to the is_release gate.
#   - Two artifacts per build: AppImage (self-contained, any distro) and deb
#     (apt install). Both come out of a single electron-builder --linux run;
#     targets and deb metadata live in apps/shell/electron-builder.cjs.
#   - Auto-update covers AppImage runs only: electron-updater's
#     AppImageUpdater replaces the .AppImage in place; deb installs run no
#     updater (users upgrade via `apt install ./<new>.deb`). Release builds
#     bake GENOFFICE_UPDATE_URL into app-update.yml and publish the
#     electron-updater feed to the CDN as beta-linux.yml (per-merge beta
#     channel, same model as beta.yml / beta-mac.yml); latest-linux.yml and
#     the GenOffice.AppImage / GenOffice.deb marketing aliases are written by
#     the promote workflow (scripts/promote-stable.cjs --linux). Smoke builds
#     get no publish config and no feed.
#   - Version: same rule as Windows/mac — major.minor from
#     apps/shell/package.json, patch = run number minus a per-train baseline.
#     (The 0.5 train used a negative baseline to continue after the manually
#     published linux-v0.5.149 release; from 0.6 on the baseline follows the
#     same predicted-first-main-build rule as the other platforms.)
#   - Release tags are prefixed linux-v so they never collide with the
#     Windows workflow's v* tags or the mac workflow's mac-v* tags. The
#     manually published linux-v0.5.149 already follows this scheme.
#   - The xlsx sidecar needs no staging step: like mac, the linux
#     extraResources entry points at cargo's host-native target/release
#     output, which build:all produces on the ubuntu runner.

on:
  push:
    branches: [main, 'dev_*', 'release_*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# One build per branch at a time, newest push wins (same rationale as
# windows-build.yml / mac-build.yml).
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # for GitHub Release creation

jobs:
  # -------------------------------------------------------------- mode
  # Same rule as windows-build.yml: main IS the release channel.
  determine-mode:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.mode.outputs.is_release }}
    steps:
      - id: mode
        shell: bash
        run: |
          set -eu
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" =~ ^refs/heads/release_ ]]; then
            echo "is_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${{ github.ref }}"

  # -------------------------------------------------------------- build
  build:
    needs: determine-mode
    # 22.04, not -latest: the xlsx sidecar is compiled on the runner and
    # links the host glibc. Building on 24.04 (glibc 2.39) would produce a
    # sidecar that refuses to start on the Ubuntu 22.04 / glibc 2.34+ floor
    # the README and release notes promise. x64 artifacts.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # ---- derive version FIRST so packaging can bake it in --------------
      # major.minor from apps/shell/package.json, patch = run number minus a
      # per-train baseline (same scheme as windows/mac). When bumping
      # major.minor in package.json, set BASE to the predicted run number of
      # the FIRST main build of the new train (the clamp below then covers a
      # slightly-high prediction, same as the other platforms). The .0 clamp
      # is guarded by a tag-exists check: only the train's FIRST release
      # build may claim .0; a later release build still below the (padded)
      # baseline fails fast here — fix by setting BASE to the run number of
      # the build that published .0.
      - name: Derive version + date
        id: version
        shell: bash
        run: |
          set -eu
          MM=$(node -p "require('./apps/shell/package.json').version.split('.').slice(0,2).join('.')")
          BASE=70  # run number of the main build that published linux-v0.6.0
          PATCH=$(( ${{ github.run_number }} - BASE ))
          if [ "$PATCH" -lt 0 ]; then
            if [ "${{ needs.determine-mode.outputs.is_release }}" = "true" ]; then
              # ls-remote --exit-code: 0 = tag exists, 2 = absent (good path);
              # anything else means the lookup failed — abort rather than
              # risk re-claiming an existing .0.
              RC=0; git ls-remote --exit-code origin "refs/tags/linux-v$MM.0" >/dev/null || RC=$?
              if [ "$RC" -eq 0 ]; then
                echo "::error::linux-v$MM.0 is already released but run ${{ github.run_number }} is still below BASE=$BASE — set BASE to the run number of the build that published linux-v$MM.0 so this train continues at .1, .2, ..."
                exit 1
              elif [ "$RC" -ne 2 ]; then
                echo "::error::git ls-remote failed (exit $RC) while checking for tag linux-v$MM.0"
                exit 1
              fi
              FULL="$MM.0"
            else
              FULL="$MM.0-pre.${{ github.run_number }}"
            fi
          else
            FULL="$MM.$PATCH"
          fi
          DATETIME="$(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          COMMIT="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "full=$FULL"          >> "$GITHUB_OUTPUT"
          echo "datetime=$DATETIME"  >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"      >> "$GITHUB_OUTPUT"
          echo "Version=$FULL  Datetime=$DATETIME  Commit=$COMMIT"

      # ---- build ----------------------------------------------------------
      # Same order as Windows/mac: notices -> build:all (sheets' build runs
      # `cargo build` for the sidecar; the linux extraResources path is the
      # host target/release binary, so no staging step is needed).
      - name: Build modules
        shell: bash
        run: |
          set -eu
          npm run notices
          npm run build:all

      # ---- package (AppImage + deb, no signing) -----------------------
      # Release builds inject GENOFFICE_UPDATE_URL so electron-builder bakes
      # app-update.yml into the app and writes latest-linux.yml next to the
      # artifacts (the updater feed the CDN publish step uploads as
      # beta-linux.yml). Smoke builds omit it: no publish config, no feed,
      # in-app auto-update stays disabled.
      - name: Package (electron-builder AppImage+deb, with update feed)
        if: needs.determine-mode.outputs.is_release == 'true'
        working-directory: apps/shell
        env:
          GENOFFICE_UPDATE_URL: ${{ secrets.GENOFFICE_UPDATE_URL }}
        run: npx electron-builder --linux "-c.extraMetadata.version=${{ steps.version.outputs.full }}"

      - name: Package (electron-builder AppImage+deb, smoke)
        if: needs.determine-mode.outputs.is_release != 'true'
        working-directory: apps/shell
        run: npx electron-builder --linux "-c.extraMetadata.version=${{ steps.version.outputs.full }}"

      - name: Inspect output
        id: artifact
        shell: bash
        run: |
          set -eu
          cd apps/shell/release
          ls -lh *.AppImage *.deb
          # latest-linux.yml only exists when a publish config was present,
          # i.e. release builds with GENOFFICE_UPDATE_URL injected — smoke
          # builds intentionally have no update feed.
          if [[ "${{ needs.determine-mode.outputs.is_release }}" == "true" ]]; then
            ls -lh latest-linux.yml
          fi
          APPIMAGE=$(ls GenOffice-*.AppImage | head -n1)
          DEB=$(ls genoffice_*.deb | head -n1)
          echo "appimage_name=$APPIMAGE"                                   >> "$GITHUB_OUTPUT"
          echo "deb_name=$DEB"                                             >> "$GITHUB_OUTPUT"
          echo "appimage_size_mb=$(( $(stat -c%s "$APPIMAGE") / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"
          echo "deb_size_mb=$(( $(stat -c%s "$DEB") / 1024 / 1024 ))"           >> "$GITHUB_OUTPUT"
          echo "appimage_md5=$(md5sum "$APPIMAGE" | cut -d' ' -f1)"        >> "$GITHUB_OUTPUT"
          echo "deb_md5=$(md5sum "$DEB" | cut -d' ' -f1)"                  >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: genoffice-linux-v${{ steps.version.outputs.full }}
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/latest-linux.yml
          retention-days: 30

      # ---- CDN publish (release builds only) --------------------------
      # Same model as mac: uploads AppImage + deb, rewrites feed URLs to
      # absolute CDN paths, archives GenOffice-linux-<version>.yml for the
      # promote workflow and moves beta-linux.yml last (no-cache). The
      # GenOffice.AppImage / GenOffice.deb marketing aliases are NOT touched
      # by beta publishes — the promote workflow re-points them. The script
      # refuses to publish unless the version is strictly newer than the CDN's.
      - name: Publish to CDN
        if: needs.determine-mode.outputs.is_release == 'true'
        shell: bash
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          GENOFFICE_UPDATE_URL: ${{ secrets.GENOFFICE_UPDATE_URL }}
        run: |
          set -eu
          # The storage container / blob prefix are substrings of the secret
          # URL, so GitHub's automatic masking does not cover them — mask
          # them explicitly before the upload script logs anything.
          URL="${GENOFFICE_UPDATE_URL%/}"
          REL="${URL#*://*/}"
          echo "::add-mask::${REL%%/*}"
          echo "::add-mask::${REL#*/}"
          node scripts/linux-release-upload.cjs --channel beta

      # ---- Job summary ------------------------------------------------
      - name: Step summary
        shell: bash
        run: |
          {
            echo "## GenOffice Linux v${{ steps.version.outputs.full }}"
            echo ""
            echo "| Artifact | Size |"
            echo "|----------|------|"
            echo "| \`${{ steps.artifact.outputs.appimage_name }}\` | ${{ steps.artifact.outputs.appimage_size_mb }} MB |"
            echo "| \`${{ steps.artifact.outputs.deb_name }}\` | ${{ steps.artifact.outputs.deb_size_mb }} MB |"
            echo ""
            if [[ "${{ needs.determine-mode.outputs.is_release }}" == "true" ]]; then
              echo "Release build — published as GitHub Release \`linux-v${{ steps.version.outputs.full }}\`"
              echo "and to the update CDN (feed \`beta-linux.yml\`; the stable feed and the"
              echo "\`GenOffice.AppImage\` / \`GenOffice.deb\` aliases only move on promote)."
            else
              echo "Smoke build — workflow artifact only, no GitHub Release, no CDN."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Compose release-notes body -------------------------------
      # Body format follows the manually published linux-v0.5.149 release
      # (install instructions + MD5 lines) plus the build-metadata table the
      # other platforms include.
      - name: Compose release notes
        if: needs.determine-mode.outputs.is_release == 'true'
        id: notes
        shell: bash
        run: |
          set -eu
          VER="${{ steps.version.outputs.full }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          APPIMAGE="${{ steps.artifact.outputs.appimage_name }}"
          DEB="${{ steps.artifact.outputs.deb_name }}"
          BODY="apps/shell/release/release-notes.md"
          {
            echo "## GenOffice Linux \`v${VER}\` (x64)"
            echo ""
            echo "AI-native office suite (Docs / Sheets / Slides / PDF) — AppImage + deb."
            echo ""
            echo "### Build metadata"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VER}\` |"
            echo "| Built | \`${{ steps.version.outputs.datetime }}\` |"
            echo "| Commit | [\`${{ steps.version.outputs.commit }}\`](${COMMIT_URL}) |"
            echo "| Build ID | [${{ github.run_id }}](${RUN_URL}) |"
            echo "| AppImage size | ${{ steps.artifact.outputs.appimage_size_mb }} MB |"
            echo "| deb size | ${{ steps.artifact.outputs.deb_size_mb }} MB |"
            echo ""
            echo "## Debian / Ubuntu (recommended)"
            echo ""
            echo '```bash'
            echo "sudo apt install ./${DEB}"
            echo '```'
            echo ""
            echo "Installs dependencies automatically and adds GenOffice to the applications menu."
            echo ""
            echo "## Other distros (AppImage)"
            echo ""
            echo "Requirements: x86_64, glibc 2.34+ (Ubuntu 22.04 or newer), FUSE 2 runtime (\`libfuse2\`; on Ubuntu 24.04 \`libfuse2t64\`)."
            echo ""
            echo '```bash'
            echo "chmod +x ${APPIMAGE}"
            echo "./${APPIMAGE}"
            echo '```'
            echo ""
            echo "MD5: AppImage ${{ steps.artifact.outputs.appimage_md5 }}, deb ${{ steps.artifact.outputs.deb_md5 }}"
            echo ""
            echo "In-app auto-update works for AppImage runs via \`beta-linux.yml\` (beta channel; the stable feed moves when a version is promoted). deb installs update via \`apt install\` with the newer package."
          } > "$BODY"
          cat "$BODY"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      # ---- GitHub Release (release builds only) ----------------------
      # Tag is prefixed linux-v: this workflow's run numbers are unrelated
      # to the Windows/mac workflows', so sharing tag namespaces would
      # collide.
      - name: Create GitHub Release
        if: needs.determine-mode.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'linux-v${{ steps.version.outputs.full }}'
          name: 'GenOffice Linux v${{ steps.version.outputs.full }}'
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          files: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/latest-linux.yml
