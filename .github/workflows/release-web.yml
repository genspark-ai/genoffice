name: Release Web Server

on:
  push:
    tags:
      - 'web-server/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.8.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Server
        run: npm run build -w @genoffice/web-server

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/web-server/dist/**
            apps/web-server/README.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        run: |
          cd apps/web-server
          zip -r genoffice-web.zip dist
          echo "::set-output name=ASSET_PATH::$(pwd)/genoffice-web.zip"
        id: asset
