name: Upstream sync

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-upstream-pr:
    # This workflow is for maintained forks. It must remain inert if the file
    # is accepted into the official mirror.
    if: github.repository != 'genspark-ai/genoffice'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      branch: ${{ steps.sync.outputs.branch }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rebase a review branch onto upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/genspark-ai/genoffice.git
          git fetch upstream main --prune
          fork_head=$(git rev-parse HEAD)
          upstream_head=$(git rev-parse upstream/main)
          if [ "$fork_head" = "$upstream_head" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="upstream-sync/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          # A conflict fails the job. It never force-pushes or modifies main.
          git rebase upstream/main
          git push --set-upstream origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open review PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Sync upstream GenOffice changes" \
            --body "Review upstream changes before merging. Run the provider, migration, and full regression suites; this workflow does not access userData settings or credentials."
