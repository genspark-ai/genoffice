name: Windows installer

# Builds the Windows NSIS installer (.exe) on a Windows runner and uploads it as
# a downloadable workflow artifact. Unsigned: Windows SmartScreen may warn on
# first run.

on:
  push:
    branches: ['dev_office-fit']
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (Windows GNU target for the xlsx sidecar)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build xlsx sidecar (x86_64-pc-windows-gnu)
        run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/shell/release/*.exe
            apps/shell/release/*.blockmap
            apps/shell/release/latest*.yml
          if-no-files-found: error
