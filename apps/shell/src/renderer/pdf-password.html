<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOffice</title>
    <style>
      :root {
        --accent: #2367ec;
        --accent-hover: #1b58cf;
        --text: #242424;
        --text-muted: #878e96;
        --border: #e3e6ea;
        --error: #b3261e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 24px 28px 20px;
      }
      #title {
        font-size: 16px;
        font-weight: 600;
      }
      #file {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #prompt {
        font-size: 13px;
        line-height: 1.5;
        min-height: 20px;
      }
      #prompt.error {
        color: var(--error);
      }
      #password {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 36px;
        padding: 0 10px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
      }
      #password:focus {
        border-color: var(--accent);
      }
      #password:disabled {
        background: #f5f6f8;
        color: var(--text-muted);
      }
      #buttons {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      button {
        -webkit-app-region: no-drag;
        height: 34px;
        padding: 0 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #ok {
        border: none;
        background: var(--accent);
        color: #fff;
      }
      #ok:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      #cancel {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
      }
      #cancel:hover:not(:disabled) {
        background: #f5f6f8;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="title"></div>
      <div id="file"></div>
      <div id="prompt"></div>
      <input id="password" type="password" autocomplete="off" spellcheck="false" />
      <div id="buttons">
        <button id="cancel"></button>
        <button id="ok"></button>
      </div>
    </div>
    <script type="module" src="/src/pdf-password.ts"></script>
  </body>
</html>
