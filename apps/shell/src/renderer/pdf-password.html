<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenOffice</title>
    <style>
      /* Genspark DS form-dialog palette (mockups/protect-dialogs-genspark.html §1/2) */
      :root {
        --color-btn-primary: #232425;
        --color-btn-primary-hover: #393a3b;
        --color-text-primary: #232425;
        --color-text-secondary: #6b6f76;
        --color-text-tertiary: #9aa0a6;
        --color-border-default: #eaeaea;
        --color-border-strong: #d9d9d9;
        --color-bg-subtle: #f5f5f5;
        --color-error: #ef4444;
        --input-focus: #0f7fff;
        --input-ring: rgb(15 127 255 / 10%);
        --error-ring: rgb(239 68 68 / 10%);
        --focus-ring: rgb(35 36 37 / 20%);
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--color-text-primary);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 16px;
        border: 1px solid var(--color-border-default);
        padding: 24px;
      }
      #title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }
      #prompt {
        font-size: 13px;
        line-height: 1.6;
        color: var(--color-text-secondary);
      }
      #file {
        font-size: 12px;
        color: var(--color-text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 2px 0 20px;
      }
      #label {
        /* interactive (for="password"): keep clicks out of the drag region */
        -webkit-app-region: no-drag;
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      #pwd-wrap {
        position: relative;
        display: block;
      }
      #password {
        -webkit-app-region: no-drag;
        display: block;
        width: 100%;
        height: 38px;
        padding: 0 40px 0 12px;
        font-size: 13px;
        font-family: inherit;
        color: var(--color-text-primary);
        background: #fff;
        border: 1px solid var(--color-border-default);
        border-radius: 12px;
        outline: none;
        transition:
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
      }
      #password:hover:not(:focus):not(.invalid) {
        border-color: var(--color-border-strong);
      }
      #password:focus {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px var(--input-ring);
      }
      #password.invalid {
        border-color: var(--color-error);
      }
      #password.invalid:focus {
        box-shadow: 0 0 0 3px var(--error-ring);
      }
      #password:disabled {
        background: var(--color-bg-subtle);
        color: var(--color-text-tertiary);
      }
      /* wrong password: shake the field */
      #pwd-wrap.has-error {
        animation: pwd-shake 0.4s ease;
      }
      @keyframes pwd-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      #eye {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--color-text-tertiary);
        cursor: pointer;
        transition:
          color var(--transition-fast),
          background var(--transition-fast);
      }
      #eye:hover:not(:disabled) {
        background: var(--color-bg-subtle);
        color: var(--color-text-primary);
      }
      #eye:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #eye svg.i-eye-off {
        display: none;
      }
      #eye.showing svg.i-eye {
        display: none;
      }
      #eye.showing svg.i-eye-off {
        display: block;
      }
      #error {
        display: none;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--color-error);
      }
      #error.visible {
        display: flex;
      }
      #error svg {
        flex-shrink: 0;
      }
      #buttons {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }
      button {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      button:active:not(:disabled) {
        filter: brightness(0.88);
        transform: scale(0.98);
      }
      #ok {
        border: 1px solid var(--color-btn-primary);
        background: var(--color-btn-primary);
        color: #fff;
      }
      #ok:hover:not(:disabled) {
        border-color: var(--color-btn-primary-hover);
        background: var(--color-btn-primary-hover);
      }
      #cancel {
        border: 1px solid var(--color-border-default);
        background: #fff;
        color: var(--color-text-primary);
      }
      #cancel:hover:not(:disabled) {
        background: var(--color-bg-subtle);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="title"></div>
      <div id="prompt"></div>
      <div id="file"></div>
      <label id="label" for="password"></label>
      <span id="pwd-wrap">
        <input id="password" type="password" autocomplete="off" spellcheck="false" />
        <button id="eye" type="button" tabindex="-1">
          <svg
            class="i-eye"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg
            class="i-eye-off"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path
              d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
            />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" x2="22" y1="2" y2="22" />
          </svg>
        </button>
      </span>
      <span id="error" role="alert">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
        <span id="error-text"></span>
      </span>
      <div id="buttons">
        <button id="cancel"></button>
        <button id="ok"></button>
      </div>
    </div>
    <script type="module" src="/src/pdf-password.ts"></script>
  </body>
</html>
