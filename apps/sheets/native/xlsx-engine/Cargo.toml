[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Run indexing and recalc inline instead of on threads, as WebAssembly builds
# without threads must; lets that path be tested on any machine.
single-thread = []

[dependencies]
base64 = "0.22.1"
# Pinned to the fork until tafia/calamine merges the formula-decode fixes:
# the reference-token flags, the bijective column letters, and the SHRFMLA
# parsing that reconstructs shared-formula members. Upstream thread:
# https://github.com/tafia/calamine/pull/740
calamine = { git = "https://github.com/tokg-venv/calamine", rev = "017e287b72bf9041e5246227b88dcbed436dee33" }
ironcalc = "0.7.1"
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
