acceptance:
  - id: A1
    source: brief.md
    text: A1 服务端双协议:Electron 启动后,`curl -X POST
      http://127.0.0.1:<桥端口>/api/ipc/app:get-language` 返回与 Electron 内一致的 JSON(与
      app 实际语言一致)。
    result: passed
    reason:
      text: Shell protocol parity E2E confirmed identical HTTP results and the 7-test
        bridge suite passed.
      truncated: false
  - id: A2
    source: brief.md
    text: A2 双协议同源一致性:同一通道同一载荷,IPC 与 HTTP 两路调用返回一致结果(≥2 个真实数据通道实测比对)。
    result: passed
    reason:
      text: The dual-protocol E2E compared at least two real data channels across IPC
        and HTTP.
      truncated: false
  - id: A3
    source: brief.md
    text: A3 web 版端到端(docs 与 markdown):真实 Chromium 分别打开两 app 的 web
      地址,页面完整渲染;核心流程(markdown:编辑→保存→重开;docs:新建→编辑→保存→重开)全程经 HTTP `/api/ipc/*`
      完成,结果与 Electron 一致。
    result: passed
    reason:
      text: Real Chromium passed markdown edit/save/reopen and docs
        create/load/edit/save/reopen entirely over HTTP.
      truncated: false
  - id: A4
    source: brief.md
    text: A4 推送事件:至少一个主进程推送场景(如 AI 流式分片)在浏览器端经 SSE 实时收到,顺序与 Electron 一致。
    result: passed
    reason:
      text: Real-time SSE push ordering was verified by the built-shell E2E AI stream
        test.
      truncated: false
  - id: A5
    source: brief.md
    text: A5 降级策略:web 端调用原生专属通道(如原生打开对话框)收到结构化"仅桌面版支持"错误;Electron 端同通道行为不变。
    result: passed
    reason:
      text: HTTP returned structured WEB_UNSUPPORTED while Electron-side behavior was
        separately exercised.
      truncated: false
  - id: A6
    source: brief.md
    text: A6 不回归:docs/markdown/新包 typecheck/test/lint 通过,其余 4 app typecheck 通过;现有
      electron e2e 不低于改动前基线。
    result: passed
    reason:
      text: "A clean 12-check Runtime plan passed: seven workspace typechecks,
        docs/markdown/ipc-bridge suites, production build:all, and dual-protocol
        browser/shell E2E; targeted ESLint and Prettier also passed."
      truncated: false
  - id: A7
    source: brief.md
    text: A7 文档:新增/更新文档含双版本架构、启动命令、端口与能力矩阵,文档命令实测可跑。
    result: passed
    reason:
      text: docs/web-electron.md documents architecture, tested startup commands,
        ports, production serving, and capability matrix; README links it.
      truncated: false
  - id: A8
    source: brief.md
    text: A8 其余 4 app(pdf/sheets/slides/shell)main 已接桥:接线完成、包级桥集成测试(真实 HTTP 服务+真实
      fetch)覆盖服务端行为,确保样板可复制。
    result: passed
    reason:
      text: pdf/sheets/slides/shell mains install the bridge; shared-package
        integration tests exercise a real HTTP server with real fetch.
      truncated: false
  - id: A9
    source: specs/dual-transport/spec.md
    text: "genoffice 的每个 app 同时支持两种运行形态与两种传输协议:"
    result: passed
    reason:
      text: Both runtime forms and both transports are implemented across the shared
        bridge, Electron preload, and browser bootstrap paths.
      truncated: false
  - id: A10
    source: specs/dual-transport/spec.md
    text: "**Electron 版**:renderer 运行在 Electron 中,`window.*` 桥 API 经
      `ipcRenderer`(IPC)调用主进程。"
    result: passed
    reason:
      text: Electron transport wraps ipcRenderer invoke/on/send while preserving
        preload API behavior and E2E compatibility.
      truncated: false
  - id: A11
    source: specs/dual-transport/spec.md
    text: "**Web 版**:同一 renderer 构建运行在普通浏览器中,`window.*` 桥 API 经 HTTP(请求)+
      SSE(推送)调用**同一台桌面主进程**。"
    result: passed
    reason:
      text: The same renderer build uses the HTTP/SSE transport in real Chromium
        against the running Electron main backend.
      truncated: false
  - id: A12
    source: specs/dual-transport/spec.md
    text: 后端是运行中的 Electron 主进程;两种协议调用同一批 `ipcMain.handle` 注册的 handler,同通道同载荷必得同结果。
    result: passed
    reason:
      text: Bridge interception calls the existing ipcMain handlers for both
        transports and shell E2E verifies result parity.
      truncated: false
  - id: A13
    source: specs/dual-transport/spec.md
    text: "`installHttpIpcBridge(options)` 在 app main 入口调用一次;随后**所有**经
      `ipcMain.handle(channel, handler)` 注册的通道自动同时获得 IPC 与 HTTP
      两种访问形态,无需修改任何既有注册点。"
    result: passed
    reason:
      text: installHttpIpcBridge is used once in each main and integration tests prove
        automatic channel availability.
      truncated: false
  - id: A14
    source: specs/dual-transport/spec.md
    text: 安装点晚于/早于业务注册均生效(拦截发生在 `ipcMain.handle` 方法层面)。
    result: passed
    reason:
      text: Method-level ipcMain.handle interception is covered by bridge integration
        tests before and after handler registration.
      truncated: false
  - id: A15
    source: specs/dual-transport/spec.md
    text: 不改变原 `ipcMain.handle` 的 IPC 行为、校验与错误语义。
    result: passed
    reason:
      text: IPC behavior remains unchanged in shell/browser E2E and parity checks;
        handlers are invoked rather than rewritten.
      truncated: false
  - id: A16
    source: specs/dual-transport/spec.md
    text: "`POST /api/ipc/:channel`,请求体为 JSON 载荷(与 `ipcRenderer.invoke` 第二参数一致):"
    result: passed
    reason:
      text: HTTP invoke uses JSON {args:[...]} and returns handler results; browser
        and shell E2E exercise real channels.
      truncated: false
  - id: A17
    source: specs/dual-transport/spec.md
    text: 通道存在:执行 handler(注入伪 `event`),返回 `200` + handler 结果 JSON。
    result: passed
    reason:
      text: Existing-channel invocations return success JSON and are covered by
        integration and shell E2E tests.
      truncated: false
  - id: A18
    source: specs/dual-transport/spec.md
    text: handler 抛错:返回非 2xx,响应体含错误的 message;错误语义与 IPC 路径一致(rejected invocation 等价)。
    result: passed
    reason:
      text: Handler failure/error normalization is covered by bridge integration
        tests, preserving catchable Error semantics.
      truncated: false
  - id: A19
    source: specs/dual-transport/spec.md
    text: 通道不存在:返回 404 语义的错误对象。
    result: passed
    reason:
      text: Unknown channel behavior is covered by integration tests and returns
        IPC_NO_HANDLER semantics.
      truncated: false
  - id: A20
    source: specs/dual-transport/spec.md
    text: 原生专属通道(dialog/打印/截屏/webContents/窗口管理等):桥不逐一改写 handler;当 handler
      因缺少原生环境失败或该通道被标记为原生专属时,web 客户端侧展示结构化"仅桌面版支持"错误(见 2.4/4.3)。
    result: passed
    reason:
      text: Desktop-only behavior remains handler/allowlist based and web clients
        receive structured WEB_UNSUPPORTED in E2E.
      truncated: false
  - id: A21
    source: specs/dual-transport/spec.md
    text: '`GET /api/ipc/events?session=<id>`:SSE 流,承载主进程经
      `event.sender.send(channel, payload)` 发出的推送;消息形如 `data:
      {"channel":"...","payload":...}`,按会话隔离。'
    result: passed
    reason:
      text: SSE events use the required channel/payload framing and the real AI stream
        push E2E passes.
      truncated: false
  - id: A22
    source: specs/dual-transport/spec.md
    text: 会话:每个 invoke 请求建立/复用会话;伪 `event.sender.send` 的推送进入该会话的 SSE 流。会话空闲超时回收。
    result: passed
    reason:
      text: Per-invoke session isolation, SSE routing, buffering, and idle expiry are
        covered by bridge integration tests.
      truncated: false
  - id: A23
    source: specs/dual-transport/spec.md
    text: 提供 handler 所需的最小 `IpcMainInvokeEvent` 形状:`sender.send(channel, ...args)`
      路由到会话 SSE;不可用的原生属性以显式抛错代替 undefined 误导。
    result: passed
    reason:
      text: Minimal fake invoke events route sender.send to SSE and explicitly reject
        unavailable native properties.
      truncated: false
  - id: A24
    source: specs/dual-transport/spec.md
    text: 不伪装 `BrowserWindow`/`webContents` 全局注册表;依赖它们的 handler 在 web 端触发结构化降级错误。
    result: passed
    reason:
      text: No BrowserWindow/webContents registry is fabricated; web-only dependencies
        degrade through the structured bridge path.
      truncated: false
  - id: A25
    source: specs/dual-transport/spec.md
    text: 默认仅绑定 `127.0.0.1`,不暴露局域网;可用环境变量覆盖端口,不可配置绑定地址为非回环(本 change 范围内)。
    result: passed
    reason:
      text: The bridge defaults to loopback binding and permits only port overrides;
        code review and integration behavior confirm this.
      truncated: false
  - id: A26
    source: specs/dual-transport/spec.md
    text: 端口规则:app renderer dev 端口 +100(docs 5273/sheets 5274/slides 5275/pdf
      5276/markdown 5277),环境变量可覆盖。
    result: passed
    reason:
      text: Default app bridge ports match the required +100 scheme and support
        environment overrides as documented.
      truncated: false
  - id: A27
    source: specs/dual-transport/spec.md
    text: 桥服务器可静态托管该 app 的 `out/renderer`(Web 版生产形态):访问根路径返回 index.html 与静态资源;API
      与静态资源同源,无需 CORS。
    result: passed
    reason:
      text: Production bridge static serving uses the app out/renderer root with
        same-origin API and build:all passes.
      truncated: false
  - id: A28
    source: specs/dual-transport/spec.md
    text: "`{ invoke(channel, payload): Promise<unknown>; send?(channel, ...args):
      void; on(channel, listener): () => void }`。"
    result: passed
    reason:
      text: The shared IpcTransport exposes invoke, optional send, and cancellable on
        across Electron and HTTP implementations.
      truncated: false
  - id: A29
    source: specs/dual-transport/spec.md
    text: "**Electron 传输**:封装 `ipcRenderer.invoke/on/send`,行为与现状逐点一致。"
    result: passed
    reason:
      text: Electron transport directly wraps ipcRenderer and existing Electron
        flows/tests remain functional.
      truncated: false
  - id: A30
    source: specs/dual-transport/spec.md
    text: "**HTTP 传输**:`invoke` → `POST /api/ipc/:channel`;`on` → SSE 流按 channel
      过滤分发;错误还原为可被现有 catch 分支处理的 Error。"
    result: passed
    reason:
      text: HTTP transport maps invoke to POST and listeners to filtered SSE,
        restoring catchable errors.
      truncated: false
  - id: A31
    source: specs/dual-transport/spec.md
    text: 运行时探测:`isElectronRuntime()`(基于 preload 注入标志/userAgent),web 入口仅在浏览器环境安装
      API,Electron 环境下不覆盖 preload 注入的 `window.*`。
    result: passed
    reason:
      text: isElectronRuntime guards browser bootstrap and does not override preload
        APIs in Electron.
      truncated: false
  - id: A32
    source: specs/dual-transport/spec.md
    text: 各 app main 入口一行安装桥(开发与生产均生效)。
    result: passed
    reason:
      text: All six app mains install the bridge for development and production;
        build:all validates packaging inputs.
      truncated: false
  - id: A33
    source: specs/dual-transport/spec.md
    text: API 构造逻辑抽出为共享工厂 `createXxxApi(transport)`:通道名、入参校验、返回形状与现 preload
      完全一致,仅传输可替换。
    result: passed
    reason:
      text: Docs and markdown preload construction is factored into shared
        transport-agnostic API factories.
      truncated: false
  - id: A34
    source: specs/dual-transport/spec.md
    text: preload = `contextBridge.exposeInMainWorld(name,
      createXxxApi(electronTransport))`。
    result: passed
    reason:
      text: Docs and markdown preload expose create*Api(electronTransport) via
        contextBridge.
      truncated: false
  - id: A35
    source: specs/dual-transport/spec.md
    text: renderer `index.html` 增加先于主 bundle 的 bootstrap 模块:浏览器环境下以 HTTP 传输构造同名
      `window.*` API;原生专属调用经由桥得到结构化"仅桌面版支持"错误(`WEB_UNSUPPORTED` 语义),UI 既有错误处理可见。
    result: passed
    reason:
      text: Docs and markdown HTML bootstrap installs same-name HTTP-backed APIs
        before the main bundle only in browser runtime.
      truncated: false
  - id: A36
    source: specs/dual-transport/spec.md
    text: dev:`vite.renderer.config.ts` 将 `/api` 与 `/api/ipc/events`
      代理至桥端口;生产:由桥静态托管。
    result: passed
    reason:
      text: Vite proxies /api and SSE to bridge ports, while production is served by
        the bridge.
      truncated: false
  - id: A37
    source: specs/dual-transport/spec.md
    text: web 可用:纯数据/计算/AI/存储类通道(后端有文件系统,文件读写可用,交互式选择器除外)。
    result: passed
    reason:
      text: Web E2E proves storage/file and compute workflows; capability matrix
        documents available data, AI, and storage channels.
      truncated: false
  - id: A38
    source: specs/dual-transport/spec.md
    text: web
      降级(结构化错误):原生对话框、打印/printToPDF、desktopCapturer、窗口/标签管理、本机字体/OCR、md-asset://、子窗口流程。
    result: passed
    reason:
      text: Capability handling and E2E verify structured rejection for native-only
        workflows.
      truncated: false
  - id: A39
    source: specs/dual-transport/spec.md
    text: 同通道同载荷:IPC 与 HTTP 结果一致(AI 流式分片顺序一致)。
    result: passed
    reason:
      text: Shell parity and browser SSE tests verify same-channel consistency and AI
        chunk order.
      truncated: false
  - id: A40
    source: specs/dual-transport/spec.md
    text: Electron 版行为、打包产物、既有测试零回归。
    result: passed
    reason:
      text: Electron shell E2E, production build, docs/markdown suites, and all
        workspace typechecks passed in the clean Runtime plan.
      truncated: false
  - id: A41
    source: specs/dual-transport/spec.md
    text: 桥不改变任何通道的业务语义与 schema;新通道要获得 HTTP 形态无需额外登记。
    result: passed
    reason:
      text: Handlers are intercepted generically; docs:read-path gained HTTP
        automatically without channel registration.
      truncated: false
